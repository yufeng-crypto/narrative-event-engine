# fly.io 部署配置 — SearXNG for stock dashboard
#
# 部署：
#   cd deploy/searxng
#   flyctl launch --no-deploy --copy-config --name stock-searxng-<你的名字>
#   flyctl secrets set SEARXNG_SECRET="$(openssl rand -hex 32)"
#   flyctl deploy
#
# 部署后会得到 https://stock-searxng-<你的名字>.fly.dev

app = "stock-searxng-yufeng"

# 东京机房：到中国 + Vercel HK/SG 都近
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  # SearXNG 自身 env（secret_key 通过 fly secrets 注入，见 [secrets] 注释）
  SEARXNG_BASE_URL = ""

[http_service]
  internal_port = 8080
  force_https = true
  # 闲置 5 分钟自动停（free tier 省机时数）；有请求自动唤醒（冷启 ~3-5 秒）
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # 256mb 实测 SearXNG 容易 OOM，改 512mb 仍在 free tier 内
  cpu_kind = "shared"
  cpus = 1
